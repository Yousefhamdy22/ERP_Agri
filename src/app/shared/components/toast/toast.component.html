<div *ngIf="notify.toast$ | async as t"
  class="fixed bottom-[26px] left-1/2 -translate-x-1/2 bg-ink text-white px-[18px] py-3 rounded-[12px] text-[14px] font-semibold shadow-pop z-[60] flex items-center gap-[9px] max-w-[min(92vw,560px)] animate-pop">
  <i class="fa-solid shrink-0" [ngClass]="{
      'fa-circle-check text-[#4ade80]': t.type === 'success',
      'fa-circle-exclamation text-[#fca5a5]': t.type === 'error',
      'fa-circle-info text-[#93c5fd]': t.type === 'info'
    }"></i>
  <span>{{ t.message }}</span>
  <button (click)="notify.dismiss()" type="button"
    class="shrink-0 bg-transparent border-0 text-white/60 hover:text-white cursor-pointer p-0 ms-[4px]" title="إغلاق">
    <i class="fa-solid fa-xmark text-[12px]"></i>
  </button>
</div>
