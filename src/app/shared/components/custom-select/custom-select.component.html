<div class="relative">

  <!-- ── Trigger button ── -->
  <button type="button" (click)="toggle()" [disabled]="disabled"
    class="w-full flex items-center justify-between gap-[6px] border bg-white cursor-pointer text-right transition-all duration-150 outline-none"
    [ngClass]="{
      'border-danger': invalid,
      'border-primary ring-[2px] ring-primary/10': open && !invalid,
      'border-[#e3e6ea] hover:border-[#cdd1d8]': !open && !invalid,
      'px-[10px] py-[7px] rounded-[8px] text-[12.5px]': size === 'sm',
      'px-[11px] py-[9px] rounded-[9px] text-[13.5px]': size === 'md',
      'opacity-50 cursor-not-allowed': disabled
    }">

    <span class="truncate leading-[1.4]"
      [ngClass]="selectedOption ? 'text-[#1e2330] font-medium' : 'text-[#b3b9c2]'">
      {{ selectedOption?.label || placeholder }}
    </span>

    <i class="fa-solid fa-chevron-down text-[10px] text-[#b3b9c2] transition-transform duration-200 shrink-0"
      [ngClass]="open ? 'rotate-180' : ''"></i>
  </button>

  <!-- ── Backdrop ── -->
  <div *ngIf="open" class="fixed inset-0 z-[55]" (click)="close()"></div>

  <!-- ── Dropdown panel ── -->
  <div *ngIf="open"
    class="absolute top-[calc(100%+4px)] right-0 left-0 z-[60] bg-white border border-[#e3e6ea] rounded-[11px] shadow-[0_10px_32px_rgba(0,0,0,.12)] flex flex-col"
    [ngClass]="filteredOptions.length > 8 ? 'max-h-[320px]' : ''">

    <!-- Search (optional) -->
    <div *ngIf="searchable" class="px-[10px] pt-[8px] pb-[4px] border-b border-[#f1f2f4] shrink-0">
      <div class="flex items-center gap-[6px] bg-[#f6f7f9] rounded-[7px] px-[9px] py-[6px]">
        <i class="fa-solid fa-magnifying-glass text-[11px] text-[#b3b9c2]"></i>
        <input #searchInput [(ngModel)]="search" [ngModelOptions]="{standalone:true}"
          placeholder="بحث..."
          class="border-0 outline-none bg-transparent text-[12.5px] w-full text-[#1e2330]"
          (click)="$event.stopPropagation()"
          (keydown)="onKeydown($event)" />
        <button *ngIf="search" (click)="search = ''; $event.stopPropagation()"
          class="text-[#a3a8b2] hover:text-[#1e2330] bg-transparent border-0 cursor-pointer text-[11px]">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <!-- Options list -->
    <div class="overflow-y-auto py-[3px]" (keydown)="onKeydown($event)">

      <!-- Placeholder / reset -->
      <div *ngIf="placeholder" (click)="selectEmpty()"
        class="flex items-center justify-between px-[13px] py-[8px] cursor-pointer transition-colors duration-100"
        [ngClass]="(value === '' || value === null || value === undefined)
          ? 'bg-primary/[.06] text-primary font-semibold'
          : 'text-[#b3b9c2] hover:bg-[#f5f6fa]'"
        [style.fontSize]="size === 'sm' ? '12px' : '13px'">
        <span>{{ placeholder }}</span>
        <i *ngIf="value === '' || value === null || value === undefined"
          class="fa-solid fa-check text-[10px] text-primary shrink-0"></i>
      </div>

      <!-- Flat list (no groups) -->
      <ng-container *ngIf="!hasGroups">
        <div *ngFor="let opt of filteredOptions; let i = index" (click)="select(opt)"
          class="flex items-center justify-between gap-[8px] px-[13px] py-[8px] cursor-pointer transition-colors duration-100"
          [ngClass]="{
            'bg-primary/[.06] text-primary font-semibold': String(value) === String(opt.value),
            'hover:bg-[#f5f6fa]': String(value) !== String(opt.value) && i !== highlightIndex,
            'bg-[#eef0fb]': i === highlightIndex && String(value) !== String(opt.value),
            'opacity-40 cursor-not-allowed': opt.disabled
          }"
          [style.fontSize]="size === 'sm' ? '12px' : '13px'">
          <span class="truncate leading-[1.5]">{{ opt.label }}</span>
          <i *ngIf="String(value) === String(opt.value)"
            class="fa-solid fa-check text-[10px] text-primary shrink-0"></i>
        </div>
      </ng-container>

      <!-- Grouped list -->
      <ng-container *ngIf="hasGroups">
        <ng-container *ngFor="let g of groupedOptions">
          <div *ngIf="g.group"
            class="px-[13px] pt-[10px] pb-[4px] text-[10px] font-bold text-[#8a909c] uppercase tracking-wider select-none">
            {{ g.group }}
          </div>
          <div *ngFor="let opt of g.options" (click)="select(opt)"
            class="flex items-center justify-between gap-[8px] px-[13px] py-[8px] cursor-pointer transition-colors duration-100"
            [ngClass]="{
              'bg-primary/[.06] text-primary font-semibold': String(value) === String(opt.value),
              'hover:bg-[#f5f6fa]': String(value) !== String(opt.value),
              'opacity-40 cursor-not-allowed': opt.disabled
            }"
            [style.fontSize]="size === 'sm' ? '12px' : '13px'">
            <span class="truncate leading-[1.5]">{{ opt.label }}</span>
            <i *ngIf="String(value) === String(opt.value)"
              class="fa-solid fa-check text-[10px] text-primary shrink-0"></i>
          </div>
        </ng-container>
      </ng-container>

      <!-- No results -->
      <div *ngIf="searchable && search && filteredOptions.length === 0"
        class="px-[13px] py-[14px] text-center text-[12.5px] text-[#b3b9c2]">
        <i class="fa-solid fa-magnifying-glass text-[14px] block mb-[4px] opacity-40"></i>
        لا توجد نتائج
      </div>
    </div>
  </div>
</div>
