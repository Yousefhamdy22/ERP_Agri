<div class="invoice-print-header-root px-4 pt-3 pb-3 border-b-2 border-slate-900 mb-4 bg-white" dir="rtl">
  <div class="grid grid-cols-3 items-center w-full">

    <!-- 1. أقصى اليمين: بيانات الشركة ومكان المنشأة والتواصل -->
    <div class="text-right flex flex-col items-start justify-center">
      <div class="flex items-center gap-2">
        <i [class]="company.logoIcon || 'fa-solid fa-seedling'" class="text-blue-700 text-[14px]"></i>
        <span class="text-[17px] font-black text-slate-900 leading-none">{{ company.name }}</span>
      </div>
      <div *ngIf="options.showTagline && company.tagline" class="text-[11px] font-semibold text-slate-600 mt-1">
        {{ company.tagline }}
      </div>
      <div class="text-[11px] text-slate-700 mt-1 flex items-center gap-1.5 font-medium">
        <i class="fa-solid fa-location-dot text-blue-600 text-[11px]"></i>
        <span>{{ company.address || 'الفيوم' }}</span>
      </div>
      <div *ngIf="company.phone && options.showContactLine" class="text-[11px] text-slate-800 font-bold mt-1 flex items-center gap-1.5" dir="ltr">
        <i class="fa-solid fa-phone text-blue-600 text-[10px]"></i>
        <span>{{ company.phone }}</span>
      </div>
      <div *ngIf="company.email && options.showContactLine" class="text-[11px] text-slate-700 font-medium mt-0.5 flex items-center gap-1.5" dir="ltr">
        <i class="fa-solid fa-envelope text-blue-600 text-[10px]"></i>
        <span>{{ company.email }}</span>
      </div>
      <div *ngIf="options.showTaxId && company.taxId" class="text-[10px] text-slate-600 mt-1">
        الرقم الضريبي: <span class="font-semibold ltr-num">{{ company.taxId }}</span>
      </div>
    </div>

    <!-- 2. المنتصف: عنوان المستند وتاريخ الطباعة في المركز تماماً -->
    <div class="text-center flex flex-col items-center justify-center">
      <div class="inline-block px-5 py-2 rounded-lg border-2 border-blue-200 bg-blue-50/70 shadow-xs">
        <div class="text-[16px] font-black text-blue-950 tracking-tight">{{ documentTitle }}</div>
        <div *ngIf="documentSubtitle" class="text-[11px] font-medium text-slate-600 mt-0.5">{{ documentSubtitle }}</div>
      </div>
      <div *ngIf="options.showPrintDate" class="text-[10px] text-slate-500 mt-1.5 font-medium flex items-center justify-center gap-1">
        <i class="fa-regular fa-clock text-slate-400"></i>
        <span>تاريخ الطباعة:</span>
        <span dir="ltr" class="font-semibold">{{ printedAt | date:'yyyy/MM/dd HH:mm' }}</span>
      </div>
    </div>

    <!-- 3. أقصى اليسار: شعار الشركة -->
    <div class="flex items-center justify-start text-left" dir="ltr">
      <ng-container *ngIf="options.showLogo">
        <img *ngIf="company.logoUrl; else logoIcon"
          [src]="company.logoUrl"
          [alt]="company.name"
          class="w-[75px] h-[75px] object-contain rounded-lg border border-slate-200 p-0.5 bg-white shadow-xs ml-0 mr-auto" />
        <ng-template #logoIcon>
          <div class="w-[68px] h-[68px] rounded-lg bg-blue-700 text-white flex items-center justify-center text-[24px] shadow-sm ml-0 mr-auto">
            <i [class]="company.logoIcon || 'fa-solid fa-seedling'"></i>
          </div>
        </ng-template>
      </ng-container>
    </div>

  </div>
</div>
