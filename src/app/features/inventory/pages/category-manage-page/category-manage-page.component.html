<div class="pt-5">

  <app-page-header [breadcrumbs]="breadcrumbs" [showTitle]="false"></app-page-header>

  <div class="flex flex-col lg:flex-row items-stretch lg:items-start gap-[20px]">

  <div class="flex-1 min-w-0">
  <app-page-header
    [showBreadcrumb]="false"
    title="ادارة مجموعات الأصناف"
    icon="fa-solid fa-folder-tree"
    [subtitle]="'إجمالي: ' + totalCount + ' مجموعة'">
  </app-page-header>

  <!-- Edit Modal -->
  <div *ngIf="editingCategory"
    class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4"
    (click)="cancelEdit()">
    <div class="bg-white rounded-[16px] border border-line w-full max-w-[560px] shadow-[0_20px_60px_rgba(0,0,0,.18)]"
      (click)="$event.stopPropagation()">

      <div class="flex items-center justify-between px-[22px] py-[16px] border-b border-[#f0f1f4]">
        <div class="text-[15px] font-bold flex items-center gap-[8px]">
          <i class="fa-solid fa-pen-to-square text-primary"></i>
          تعديل: {{ editingCategory.nameAr }}
        </div>
        <button (click)="cancelEdit()"
          class="w-8 h-8 rounded-[8px] border border-[#e3e6ea] bg-white text-muted hover:bg-[#f3f4f7] cursor-pointer flex items-center justify-center text-[16px]">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form [formGroup]="editForm" (ngSubmit)="saveEdit()" class="p-[22px]">
        <div class="grid grid-cols-2 gap-[14px]">

          <div class="col-span-2 group">
            <label class="block text-[12.5px] font-semibold text-[#374151] mb-[5px] group-focus-within:text-primary transition-colors duration-150">
              الاسم <span class="text-danger">*</span>
            </label>
            <input formControlName="name"
              class="w-full px-[11px] py-[9px] border rounded-[9px] text-[14px] outline-none focus:border-primary transition"
              [ngClass]="invalid('name') ? 'border-danger' : 'border-[#e3e6ea]'" />
            <div *ngIf="invalid('name')" class="text-[11px] text-danger mt-[4px]">مطلوب</div>
          </div>

          <div class="col-span-2">
            <label class="block text-[12.5px] font-semibold text-[#374151] mb-[5px]">المجموعة الرئيسية</label>
            <app-tree-select
              formControlName="parentCategoryId"
              [options]="categoryOptions"
              placeholder="— بدون مجموعة رئيسية —">
            </app-tree-select>
          </div>

          <div class="col-span-2">
            <label class="block text-[12px] text-muted mb-[6px]">الوصف</label>
            <textarea formControlName="description" rows="2"
              class="w-full px-[11px] py-[9px] border border-[#e3e6ea] rounded-[9px] text-[14px] outline-none focus:border-primary resize-none"></textarea>
          </div>
        </div>

        <div class="flex gap-[10px] mt-[18px] pt-[14px] border-t border-[#f0f1f4]">
          <app-button variant="primary" type="submit" icon="fa-solid fa-floppy-disk" [disabled]="saving">
            {{ saving ? 'جارٍ الحفظ…' : 'حفظ التعديلات' }}
          </app-button>
          <app-button variant="ghost" (click)="cancelEdit()">إلغاء</app-button>
        </div>
      </form>
    </div>
  </div>

  <!-- Loading skeleton -->
  <div *ngIf="loading" class="bg-white border border-line rounded-[13px] p-14 text-center text-muted">
    <i class="fa-solid fa-spinner fa-spin text-[26px] block mb-3"></i>
    جارٍ تحميل المجموعات…
  </div>

  <!-- Tree -->
  <app-category-tree *ngIf="!loading"
    [categories]="categories"
    (edit)="startEdit($event)"
    (deleteCategory)="deleteCategory($event)">
  </app-category-tree>
  </div>

  <app-quick-actions-panel [topButton]="topButton" [actions]="quickActions"></app-quick-actions-panel>

  </div>
</div>
